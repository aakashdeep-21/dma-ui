<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DMA Terminal — Sign in</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="login-body">
  <form id="login-form" class="login-card" autocomplete="off">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>DMA Terminal</h1>
    </div>
    <p class="muted">Sign in to access the trading dashboard.</p>

    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required />

    <button type="submit" id="login-btn">Sign in</button>
    <div id="login-error" class="error-msg" role="alert"></div>
    <p class="muted" style="font-size:11px;margin-top:14px">Only one session can be active at a time — signing in here logs out any other tab or device.</p>
  </form>

  <script src="/static/login.js"></script>
</body>
</html>
